name: dbt build

# Runs the whole project on DuckDB, so forks need no warehouse or secrets.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python duckdb/load_raw.py
      - name: dbt deps + build
        working-directory: oms_dbt_proj
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir . --target duckdb
